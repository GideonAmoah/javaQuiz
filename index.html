<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTCT 106 — Java Practice Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#1e1f22;
    --panel:#26282b;
    --panel-2:#2d2f33;
    --text:#e7e9ec;
    --muted:#9aa0a6;
    --accent:#7ec699;
    --accent-2:#e0af68;
    --wrong:#e06c75;
    --line:#3a3d41;
    --mono: 'Fira Code', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    line-height:1.5;
    padding-bottom:80px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(30,31,34,0.96);
    backdrop-filter:blur(6px);
    z-index:10;
  }
  .tag{
    color:var(--accent-2);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  h1{
    margin:6px 0 4px;
    font-size:1.35rem;
    color:var(--text);
  }
  h1 span{color:var(--accent);}
  .sub{
    color:var(--muted);
    font-size:13px;
  }
  #progress-wrap{
    margin-top:14px;
    height:6px;
    background:var(--panel-2);
    border-radius:4px;
    overflow:hidden;
  }
  #progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .25s ease;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:20px 16px;
  }
  .q{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px 14px;
    margin-bottom:14px;
  }
  .q-num{
    color:var(--accent-2);
    font-size:12px;
    margin-bottom:6px;
  }
  .q-text{
    font-size:15px;
    margin-bottom:12px;
    color:var(--text);
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 10px;
    border-radius:7px;
    border:1px solid transparent;
    margin-bottom:6px;
    cursor:pointer;
    font-size:14px;
    transition:background .15s, border-color .15s;
  }
  .opt:hover{background:var(--panel-2);}
  .opt input{accent-color:var(--accent); margin-top:2px;}
  .opt.selected{
    background:var(--panel-2);
    border-color:var(--accent);
  }
  .opt.correct{
    border-color:var(--accent);
    background:rgba(126,198,153,0.12);
  }
  .opt.incorrect{
    border-color:var(--wrong);
    background:rgba(224,108,117,0.12);
  }
  .letter{
    color:var(--muted);
    font-weight:600;
  }
  #submit-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:12px 16px;
    display:flex;
    justify-content:center;
    gap:12px;
    z-index:20;
  }
  button{
    font-family:var(--mono);
    font-size:14px;
    padding:11px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-weight:600;
  }
  #submitBtn{
    background:var(--accent);
    color:#12291b;
  }
  #resetBtn{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    display:none;
  }
  #score-panel{
    display:none;
    max-width:720px;
    margin:0 auto 18px;
    padding:16px;
    background:var(--panel);
    border:1px solid var(--accent);
    border-radius:10px;
    text-align:center;
  }
  #score-panel .big{
    font-size:2rem;
    color:var(--accent);
  }
  #score-panel .msg{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
  }
  .unanswered-flag{
    color:var(--wrong);
    font-size:12px;
    margin-top:2px;
    display:none;
  }
</style>
</head>
<body>

<header>
  <div class="tag">BTCT 106 · Introduction to Programming in Java</div>
  <h1>Practice Quiz <span>// 56 questions</span></h1>
  <div class="sub">Merged from your Section A papers — no duplicates. Answer everything, then check score.</div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
</header>

<main id="quiz"></main>

<div id="score-panel">
  <div class="big" id="scoreBig">0 / 56</div>
  <div class="msg" id="scoreMsg"></div>
</div>

<div id="submit-bar">
  <button id="submitBtn">Check score</button>
  <button id="resetBtn">Try again</button>
</div>

<script>
const QUESTIONS = [
["Which of the following is a valid Java identifier?", ["123abc","class","myVariable","void"], 2],
["Which of these is the correct way to declare a constant in Java?", ["final int MAX = 100;","int constant MAX = 100;","const int MAX = 100;","define int MAX = 100;"], 0],
["Which keyword is used to prevent inheritance of a class?", ["static","abstract","final","private"], 2],
["Which of the following is true about constructors in Java?", ["A constructor can return a value","Constructors must have a return type","A class can have multiple constructors","Constructors can be called like methods"], 2],
["What is the purpose of the 'this' keyword in Java?", ["Refers to the current class name","Refers to the superclass","Refers to the current object","Refers to the method name"], 2],
["Which of the following access modifiers makes a member accessible to all classes?", ["private","protected","public","default"], 2],
["Which class is the root of the Java class hierarchy?", ["Class","Object","Super","Base"], 1],
["Which exception is thrown when a division by zero occurs?", ["ArithmeticException","NullPointerException","NumberFormatException","IOException"], 0],
['What is the output of: System.out.println("Hello" + 5 + 10);', ["Hello15","Hello510","Hello 15","Error"], 1],
["Which loop is best suited when the number of iterations is known?", ["while","do-while","for","if"], 2],
["Which of these statements is used to exit a loop in Java?", ["stop","exit","break","continue"], 2],
["Which method is used to compare two strings for equality in Java?", ["==","equals()","compareTo()","isEqual()"], 1],
["Which of the following is a wrapper class in Java?", ["int","double","Integer","float"], 2],
["Which of the following represents inheritance in Java?", ["A class having multiple methods","A class derived from another class","A class with overloaded constructors","A class that implements an interface"], 1],
["Which symbol is used to create a single-line comment?", ["//","/*","*/","#"], 0],
["Which of these is used to handle exceptions in Java?", ["try-catch","throw","throws","All of the above"], 3],
["What is the size of an int variable in Java?", ["8 bits","16 bits","32 bits","64 bits"], 2],
["Which keyword is used to implement an interface in Java?", ["extend","inherit","implement","implements"], 3],
["Which of the following is a correct way to create an object?", ["MyClass obj = MyClass();","MyClass obj = new MyClass();","obj = new MyClass;","class obj = new MyClass();"], 1],
["What is the default value of a reference variable in Java?", ["0","null","false","undefined"], 1],
["Which of these is the correct syntax to create a package in Java?", ["package = mypack;","package mypack;","pack mypack;","import package mypack;"], 1],
["Which of the following can be overloaded in Java?", ["Constructors only","Methods only","Both methods and constructors","None"], 2],
["What is the default value of an int variable in Java?", ["0","null","undefined","1"], 0],
["Which of the following loops checks the condition after executing the loop body?", ["for","while","do-while","if"], 2],
["Which of the following methods is used to convert a string to an integer in Java?", ["Integer.toInt()","Integer.parseInt()","parseInteger()","toInteger()"], 1],
["Which keyword is used to inherit a class in Java?", ["inherit","implements","extends","super"], 2],
["Which of these is not a Java reserved keyword?", ["native","this","goto","override"], 3],
["Which of these statements is used to handle an exception?", ["handle","throw","try","catch"], 2],
["Which class provides methods to manipulate strings?", ["Scanner","StringBuilder","StringHandler","StringParser"], 1],
["Which method is used to find the length of an array?", ["array.length()","length(array)","array.size()","array.length"], 3],
["What is a class in Java?", ["A template for creating objects","A variable","A method","An operator"], 0],
["Which of these is used to create a new line in a string?", ["\\r","\\t","\\n","\\f"], 2],
["Which of these is a valid declaration of a char in Java?", ['char c = "A";', "char c = 'A';", "char c = A;", 'char c = "65";'], 1],
["Which function is used to find the square root of a number in Java?", ["Math.sqrt()","sqrt()","Math.squareRoot()","squareRoot()"], 0],
["What is method overloading?", ["Two methods with the same name and different parameters","Two methods with different names","A method calling another method","A method overriding a parent class method"], 0],
["Which keyword is used to create an interface in Java?", ["interface","implements","extends","abstract"], 0],
["What does the continue statement do in a loop?", ["Exits the loop","Skips the current iteration","Restarts the loop","Pauses the loop"], 1],
["Which exception is thrown when a null object is accessed?", ["IOException","ArithmeticException","NullPointerException","ArrayIndexOutOfBoundsException"], 2],
["Which of the following is a valid keyword in Java?", ["interface","implement","inherits","subclass"], 0],
["What is the file extension for a Java compiled file?", [".jav",".exe",".class",".java"], 2],
["Which method is the entry point for a Java program?", ["start()","run()","main()","init()"], 2],
["Which of the following is not a primitive data type in Java?", ["int","float","boolean","string"], 3],
["What is the result of 5 + 2 * 3 in Java?", ["21","11","15","7"], 1],
["Which operator is used for comparison in Java?", ["=","==",":=","!=="], 1],
["Which loop is guaranteed to execute at least once?", ["for","while","do-while","if"], 2],
["What is the output type of the expression: 10 / 3?", ["double","float","int","long"], 2],
["Which keyword is used to create a class in Java?", ["def","class","object","struct"], 1],
["What is the access modifier that makes a member accessible within its class only?", ["private","protected","public","static"], 0],
["Which of these is a loop construct in Java?", ["switch","case","do-while","select"], 2],
["Which of these declares an array of integers in Java?", ["int array[];","int[] array;","int array[] = new int[5];","All of the above"], 3],
["Which method is used to get the length of a string?", ["size()","length","getLength()","length()"], 3],
["What is an object in Java?", ["A function","A variable of class type","An integer","A method"], 1],
["What does the 'new' keyword do in Java?", ["Deletes an object","Initializes a loop","Creates an object","Imports a package"], 2],
["Which package contains the Scanner class?", ["java.io","java.lang","java.util","java.net"], 2],
["How do you read an integer input using Scanner?", ["sc.nextInt();","sc.readInt();","sc.getInt();","sc.nextInteger();"], 0],
["What is the default value of a boolean in Java?", ["true","0","false","null"], 2]
];

const quiz = document.querySelector('#quiz');
const letters = ['A','B','C','D'];
const answers = new Array(QUESTIONS.length).fill(null);

QUESTIONS.forEach((q, qi) => {
  const div = document.createElement('div');
  div.className = 'q';
  div.id = 'q'+qi;

  const num = document.createElement('div');
  num.className = 'q-num';
  num.textContent = 'Question ' + (qi+1) + ' / ' + QUESTIONS.length;
  div.appendChild(num);

  const text = document.createElement('div');
  text.className = 'q-text';
  text.textContent = q[0];
  div.appendChild(text);

  q[1].forEach((opt, oi) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.id = 'q'+qi+'o'+oi;
    label.innerHTML = '<input type="radio" name="q'+qi+'" value="'+oi+'"><span><span class="letter">'+letters[oi]+'.</span> '+opt+'</span>';
    label.querySelector('input').addEventListener('change', () => {
      answers[qi] = oi;
      div.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      label.classList.add('selected');
      updateProgress();
    });
    div.appendChild(label);
  });

  quiz.appendChild(div);
});

function updateProgress(){
  const answered = answers.filter(a => a !== null).length;
  document.getElementById('progress-bar').style.width = (answered/QUESTIONS.length*100) + '%';
}

document.getElementById('submitBtn').addEventListener('click', () => {
  let score = 0;
  QUESTIONS.forEach((q, qi) => {
    const correctIdx = q[2];
    const chosen = answers[qi];
    const correctLabel = document.getElementById('q'+qi+'o'+correctIdx);
    correctLabel.classList.add('correct');
    if (chosen === correctIdx) {
      score++;
    } else if (chosen !== null) {
      document.getElementById('q'+qi+'o'+chosen).classList.add('incorrect');
    }
    document.querySelectorAll('#q'+qi+' input').forEach(inp => inp.disabled = true);
  });

  document.getElementById('score-panel').style.display = 'block';
  document.getElementById('scoreBig').textContent = score + ' / ' + QUESTIONS.length;
  const pct = Math.round(score/QUESTIONS.length*100);
  let msg = pct >= 80 ? "Strong work — you're exam-ready." : pct >= 60 ? "Solid, but review the missed ones." : "Worth another pass through the notes.";
  document.getElementById('scoreMsg').textContent = pct + '% correct. ' + msg;
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth'});

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'inline-block';
});

document.getElementById('resetBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
